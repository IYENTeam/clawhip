[package]
name = "evidence-ledger"
version = "0.1.0"
edition = "2024"
description = "op_pi durable evidence ledger (AGI architecture §4.2)"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = [
  "runtime-tokio",
  "tls-rustls",
  "postgres",
  "json",
  "time",
  "migrate",
  "macros",
] }
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
serial_test = "3"
uuid = { version = "1", features = ["v4"] }
