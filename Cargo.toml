[package]
name = "op_pi"
version = "0.6.11"
edition = "2024"
autobins = false
default-run = "op_pi"
description = "Operation Pipeline Interface"
license = "MIT"
repository = "https://github.com/IYENTeam/op_pi"
keywords = ["discord", "notifications", "tmux", "github", "devops"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "op_pi"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
axum = "0.8"
clap = { version = "4.5", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45", features = ["full"] }
time = { version = "0.3", features = ["formatting", "parsing"] }
uuid = { version = "1", features = ["v4"] }
toml = "0.8"
flate2 = "1"
subtle = "2"
x509-parser = "0.16"
rsa = "0.9"
sha1 = { version = "0.10", features = ["oid"] }
sha2 = { version = "0.10", features = ["oid"] }
base64 = "0.22"
hmac = "0.12.1"
hex = "0.4.3"
heck = "0.5.0"
http-body-util = "0.1"

[dev-dependencies]
serial_test = "3"
tempfile = "3.15"
tower = { version = "0.5", features = ["util"] }
futures-util = "0.3"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[workspace]
members = ["crates/evidence-ledger"]
resolver = "2"
