<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description">
  <title id="title">op-pi operation pipeline interface</title>
  <desc id="description">Operational signals from GitHub, agents, AWS, Cloudflare, and tmux converge into the op-pi pipeline and route to Discord, Slack, and local interfaces.</desc>

  <defs>
    <linearGradient id="background" x1="72" y1="28" x2="1120" y2="500" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B16"/>
      <stop offset="0.52" stop-color="#10162B"/>
      <stop offset="1" stop-color="#15102B"/>
    </linearGradient>
    <radialGradient id="cyanAtmosphere" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(386 282) rotate(12) scale(425 242)">
      <stop stop-color="#22D3B6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22D3B6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violetAtmosphere" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(832 272) rotate(168) scale(425 245)">
      <stop stop-color="#8B7CFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#8B7CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pipeline" x1="431" y1="280" x2="769" y2="280" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55E6C1"/>
      <stop offset="0.5" stop-color="#4AA8FF"/>
      <stop offset="1" stop-color="#8B7CFF"/>
    </linearGradient>
    <linearGradient id="core" x1="528" y1="207" x2="675" y2="352" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55E6C1"/>
      <stop offset="0.46" stop-color="#4AA8FF"/>
      <stop offset="1" stop-color="#8B7CFF"/>
    </linearGradient>
    <linearGradient id="glass" x1="206" y1="124" x2="1012" y2="449" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.025"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.06"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#9CA3AF" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.18 0 1 0 0 0.68 0 0 1 0 1 0 0 0 0.55 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="coreShadow" x="-70%" y="-70%" width="240%" height="240%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="24" flood-color="#4AA8FF" flood-opacity="0.25"/>
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#55E6C1" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect x="1" y="1" width="1198" height="518" rx="28" fill="url(#background)"/>
  <rect x="1" y="1" width="1198" height="518" rx="28" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="518" rx="28" fill="url(#cyanAtmosphere)"/>
  <rect x="1" y="1" width="1198" height="518" rx="28" fill="url(#violetAtmosphere)"/>
  <rect x="1" y="1" width="1198" height="518" rx="28" stroke="#94A3B8" stroke-opacity="0.18" stroke-width="2"/>

  <g font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="64" y="77" fill="#F8FAFC" font-size="28" font-weight="700" letter-spacing="5">OP-PI</text>
    <text x="64" y="106" fill="#94A3B8" font-size="13" font-weight="600" letter-spacing="2.4">OPERATION PIPELINE INTERFACE</text>

    <g transform="translate(999 60)">
      <circle cx="0" cy="0" r="5" fill="#55E6C1" filter="url(#softGlow)"/>
      <text x="16" y="5" fill="#A7F3D0" font-size="12" font-weight="600" letter-spacing="1.6">PIPELINE ONLINE</text>
    </g>

    <rect x="64" y="142" width="1072" height="302" rx="24" fill="url(#glass)" stroke="#CBD5E1" stroke-opacity="0.12"/>

    <text x="104" y="178" fill="#64748B" font-size="11" font-weight="700" letter-spacing="2">SIGNALS</text>
    <text x="1012" y="178" fill="#64748B" font-size="11" font-weight="700" letter-spacing="2" text-anchor="end">INTERFACES</text>

    <g fill="none" stroke-linecap="round">
      <path d="M286 207 C390 207 405 279 495 279" stroke="#55E6C1" stroke-opacity="0.5" stroke-width="2"/>
      <path d="M286 254 C390 254 412 279 495 279" stroke="#4AA8FF" stroke-opacity="0.54" stroke-width="2"/>
      <path d="M286 301 C390 301 412 279 495 279" stroke="#8B7CFF" stroke-opacity="0.54" stroke-width="2"/>
      <path d="M286 348 C390 348 405 279 495 279" stroke="#A78BFA" stroke-opacity="0.48" stroke-width="2"/>
      <path d="M286 395 C390 395 396 279 495 279" stroke="#64748B" stroke-opacity="0.42" stroke-width="2"/>

      <path d="M705 279 C802 279 814 226 912 226" stroke="#55E6C1" stroke-opacity="0.58" stroke-width="2"/>
      <path d="M705 279 C802 279 814 279 912 279" stroke="#4AA8FF" stroke-opacity="0.62" stroke-width="2"/>
      <path d="M705 279 C802 279 814 332 912 332" stroke="#8B7CFF" stroke-opacity="0.58" stroke-width="2"/>
    </g>

    <g>
      <rect x="104" y="189" width="182" height="36" rx="10" fill="#0B1322" fill-opacity="0.88" stroke="#55E6C1" stroke-opacity="0.32"/>
      <circle cx="124" cy="207" r="4" fill="#55E6C1"/>
      <text x="140" y="212" fill="#D1FAE5" font-size="13" font-weight="650">GITHUB + GIT</text>

      <rect x="104" y="236" width="182" height="36" rx="10" fill="#0B1322" fill-opacity="0.88" stroke="#4AA8FF" stroke-opacity="0.32"/>
      <circle cx="124" cy="254" r="4" fill="#4AA8FF"/>
      <text x="140" y="259" fill="#DBEAFE" font-size="13" font-weight="650">AGENT HOOKS</text>

      <rect x="104" y="283" width="182" height="36" rx="10" fill="#0B1322" fill-opacity="0.88" stroke="#8B7CFF" stroke-opacity="0.32"/>
      <circle cx="124" cy="301" r="4" fill="#8B7CFF"/>
      <text x="140" y="306" fill="#EDE9FE" font-size="13" font-weight="650">AWS</text>

      <rect x="104" y="330" width="182" height="36" rx="10" fill="#0B1322" fill-opacity="0.88" stroke="#A78BFA" stroke-opacity="0.32"/>
      <circle cx="124" cy="348" r="4" fill="#A78BFA"/>
      <text x="140" y="353" fill="#EDE9FE" font-size="13" font-weight="650">CLOUDFLARE</text>

      <rect x="104" y="377" width="182" height="36" rx="10" fill="#0B1322" fill-opacity="0.88" stroke="#64748B" stroke-opacity="0.32"/>
      <circle cx="124" cy="395" r="4" fill="#94A3B8"/>
      <text x="140" y="400" fill="#E2E8F0" font-size="13" font-weight="650">TMUX + DISCORD</text>
    </g>

    <g filter="url(#coreShadow)">
      <circle cx="600" cy="279" r="82" fill="#0A1020" stroke="url(#core)" stroke-width="2.5"/>
      <circle cx="600" cy="279" r="67" fill="#0E172B" stroke="#E2E8F0" stroke-opacity="0.12"/>
      <path d="M554 279 H646" stroke="url(#pipeline)" stroke-width="5" stroke-linecap="round"/>
      <circle cx="554" cy="279" r="7" fill="#55E6C1"/>
      <circle cx="600" cy="279" r="9" fill="#4AA8FF"/>
      <circle cx="646" cy="279" r="7" fill="#8B7CFF"/>
      <text x="600" y="247" fill="#F8FAFC" font-size="12" font-weight="700" letter-spacing="2.4" text-anchor="middle">OP-PI</text>
      <text x="600" y="319" fill="#94A3B8" font-size="10" font-weight="600" letter-spacing="1.5" text-anchor="middle">ROUTE WITH INTENT</text>
    </g>

    <g>
      <rect x="912" y="208" width="184" height="36" rx="10" fill="#0B1322" fill-opacity="0.88" stroke="#55E6C1" stroke-opacity="0.32"/>
      <circle cx="932" cy="226" r="4" fill="#55E6C1"/>
      <text x="948" y="231" fill="#D1FAE5" font-size="13" font-weight="650">DISCORD</text>

      <rect x="912" y="261" width="184" height="36" rx="10" fill="#0B1322" fill-opacity="0.88" stroke="#4AA8FF" stroke-opacity="0.32"/>
      <circle cx="932" cy="279" r="4" fill="#4AA8FF"/>
      <text x="948" y="284" fill="#DBEAFE" font-size="13" font-weight="650">SLACK</text>

      <rect x="912" y="314" width="184" height="36" rx="10" fill="#0B1322" fill-opacity="0.88" stroke="#8B7CFF" stroke-opacity="0.32"/>
      <circle cx="932" cy="332" r="4" fill="#8B7CFF"/>
      <text x="948" y="337" fill="#EDE9FE" font-size="13" font-weight="650">LOCAL + DROP</text>
    </g>

    <text x="600" y="485" fill="#CBD5E1" font-size="14" font-weight="500" letter-spacing="0.6" text-anchor="middle">
      Signals in. Decisions routed. Actions out.
    </text>
  </g>
</svg>
